<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Government Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <link rel = "stylesheet"
            href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>


<body>

    <!-- Top navigation -->

    <header class="topbar">

        <div>
            <h1>Disaster Risk Management</h1>
            <p>Government Decision Support System</p>
        </div>

        <div class="user-area">

            <span>Welcome, {{ session["username"] }}</span>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </header>


    <!-- Main dashboard -->

    <main class="dashboard">

        <h2>Risk Overview</h2>


        <!-- Summary cards -->

        <section class="area-selection">

        <div class="selection-box">

        <label for="state">State</label>

        <select id="state">
            <option value="">Select State</option>
            <option value="maharashtra">Maharashtra</option>
            <option value="uttarakhand">Uttarakhand</option>
            <option value="kerala">Kerala</option>
        </select>

        </div>


        <div class="selection-box">

            <label for="district">District</label>

            <select id="district">

                <option value="">
                    Select District
                </option>

            </select>

        </div>


        <button id="analyse-button">
            Analyse Area
        </button>

    </section>

        <section class="stats">

            <div class="stat-card">
                <span>High-Risk Habitations</span>
                <strong>12</strong>
            </div>


            <div class="stat-card">
                <span>Red Zones</span>
                <strong>4</strong>
            </div>


            <div class="stat-card">
                <span>Potential Safe Sites</span>
                <strong>8</strong>
            </div>

        </section>


        <!-- Map -->

        <section class="map-section">

            <h2>Risk Map</h2>

            <p id="selected-area">No area selected.

            </p>

            <div id="map">

            </div>

        </section>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>

</html>
